<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        section {
            display: flex;
            justify-content: center;
        }

        article {
            position: relative;
        }

        article .img {
            position: relative;
            width: 600px;
            height: 400px;
        }

        article img {
            position: absolute;
        }

        article .text1 {
            position: absolute;
            font-size: 60px;
            bottom: 20px;
            right: 20px;
            color: #fff;
            font-weight: bold;
            pointer-events: none;
        }

        .bigRed {
            color: rgb(212, 4, 4);
            font-size: 100px;
            font-weight: bold;
        }

        .hide1 {
            display: none;
        }

        .text2 {
            font-size: 36px;
            text-align: center;
        }

        .color1 {
            color: #fad264;
            font-weight: bold;
        }
    </style>
    <title>滑鼠事件</title>
</head>

<body>
    <section>
        <article>
            <div class="img">
                <img src="https://images.pexels.com/photos/8728408/pexels-photo-8728408.jpeg?auto=compress&cs=tinysrgb&w=600"
                    draggable="false">
                <div class="text1 hide1">
                    只要 <span class="bigRed">199</span> 元
                </div>
            </div>
            <div class="text2">走過路過不要錯過，滑滑看點點看哦</div>
        </article>
    </section>

    <script>
        const text1 = document.querySelector(".text1");
        const text2 = document.querySelector(".text2");
        const img = document.querySelector("img");

        img.addEventListener("mousedown", function () {
            text1.classList.remove("hide1");
        });
        img.addEventListener("mouseup", function () {
            text1.classList.add("hide1");
        });

        text2.addEventListener("mouseenter", function () {
            this.classList.add("color1")
        });
        text2.addEventListener("mouseleave", function () {
            this.classList.remove("color1")
        });
    </script>
</body>

</html>
