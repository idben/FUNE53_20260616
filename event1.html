<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .textArea {
            position: relative;
            left: 0;
            right: 0;
            margin: auto;
            margin-top: 100px;
            width: 400px;
            height: 100px;
            user-select: none;
        }

        .text {
            font-size: 60px;
            text-align: center;
        }

        .reset {
            position: absolute;
            right: 0;
            width: 50px;
            background-color: #ed7009;
            color: #fff;
            text-align: center;
            border-radius: 5px;
        }

        .color1 {
            color: #fad264;
        }

        .color2 {
            color: #ed4256;
        }
    </style>
    <title>點擊相關</title>
</head>

<body>
    <div class="textArea">
        <div class="text">白日依山盡</div>
        <div class="reset">重置</div>
    </div>
</body>

</html>
