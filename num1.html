<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 數字</title>
</head>

<body>


    <script>
        console.log(99999999999999);
        console.log(999999999999999);
        console.log(9999999999999999);

        console.log(0.1);
        console.log(0.1 + 0.1);
        console.log(0.1 + 0.1 + 0.1);


        // toString
        console.log((123).toString().padStart(5, "A")); // 顯性轉法
        console.log((456 + "").padEnd(5, "B")); // 隱性轉法


        // toFixed 小數點下取幾位, 結果會變字串
        const x = 3.1415
        console.log(x.toFixed(2));
        console.log(x.toFixed(2) + 3);


        // Number 轉數字
        console.log(Number(x.toFixed(2)) + 3);
        console.log(parseFloat(x.toFixed(2)) + 3);
        console.log(parseInt(x.toFixed(2)) + 3);




    </script>
</body>

</html>
