<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .boxs {
            display: flex;
            gap: 10px;

            .box {
                width: 50px;
                height: 50px;
                background-color: #a5eeec;
                font-family: sans-serif;
                font-size: 24px;
                display: flex;
                justify-content: center;
                align-items: center;
            }
        }
    </style>
    <title>while 迴圈的實際用法</title>
</head>

<body>
    <div class="boxs">
        <!-- .box*10.box$>{$} -->
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3 tt">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
        <div class="box box6">6</div>
        <div class="box box7 tt">7</div>
        <div class="box box8">8</div>
        <div class="box box9 tt">9</div>
        <div class="box box10 tt">10</div>
    </div>

    <script>
        const boxs = document.querySelectorAll(".box");
        const ary = Array.from(boxs)
        console.log(ary);

        // ary.pop().remove()
        // console.log(ary.pop().className.includes("tt"));
        while (ary.length > 0) {
            const node = ary.pop();
            if (node.className.includes("tt")) {
                node.remove()
            }
        }


    </script>
</body>

</html>
